name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes needs history back to the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pinned to the 11.x line on purpose: npm 12 requires Node >= 22.22.2,
      # so an unpinned @latest breaks this job against our Node 20 floor.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # prepublishOnly rebuilds dist/; provenance is attached automatically via OIDC.
      - run: npm publish

      - name: Pack tarball for the release
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag ./*.tgz
